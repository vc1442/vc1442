<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>My Profile</h1>
    </header>
    <main>
        <section id="avatar">
            <img src="avatar.jpg" alt="Avatar" />
            <h2>My Name</h2>
        </section>
        <section id="social-links">
            <h3>Connect with me</h3>
            <ul>
                <li><a href="https://twitter.com/myprofile">Twitter</a></li>
                <li><a href="https://linkedin.com/in/myprofile">LinkedIn</a></li>
                <li><a href="https://github.com/myprofile">GitHub</a></li>
            </ul>
        </section>
        <section id="skills">
            <h3>Skills</h3>
            <ul>
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
                <li>React</li>
                <li>Node.js</li>
            </ul>
        </section>
        <section id="statistics">
            <h3>Statistics</h3>
            <ul>
                <li>Projects Completed: 20</li>
                <li>GitHub Stars: 150</li>
                <li>Followers: 300</li>
            </ul>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 My Name</p>
    </footer>
</body>
</html>
